[project]
name = "ns-delay-predictor"
version = "0.1.0"
description = "NS Delay Predictor System"
readme = "README.md"
authors = [
    { name = "alinesaei", email = "nesaeialii@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "pandas>=3.1.0",
    "pyarrow>=26.0.0",
    "requests>=2.34.2",
]

[project.scripts]
ns-delay-predictor = "ns_delay_predictor:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]
